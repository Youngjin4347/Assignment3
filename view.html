<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>도서 추가</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- My CSS -->
    <link rel="stylesheet" href="my.css">
</head>

<body>

    <header>
        <nav class="navbar navbar-dark fixed-top bg-dark">
            <div class="container-fluid justify-content-between">

                <div class="d-flex align-items-center">
                    <img src="https://previews.123rf.com/images/siamimages/siamimages1612/siamimages161200561/67760057-book-icon-illustration-design.jpg"
                        class="logo" alt="Book Management">

                    <p class="navbar-brand mb-0 ms-2">Book Management</p>
                </div>

                <a href="index.html" class="nav-link text-white me-3">
                    Go to Home
                </a>

            </div>
        </nav>
        
        <div class="container pt-5">
            <h1>도서 상세 정보</h1>
            <p>선택한 도서의 정보를 확인할 수 있습니다.</p>
        </div>
    </header>

    <main class="container mt-5 pt-5">




        <div class="card book-detail-card">

            <div class="card-header">
                도서 정보
            </div>

            <div class="card-body">

                <div class="book-info">
                    <strong>도서 ID</strong>
                    <p>228261</p>
                </div>

                <div class="book-info">
                    <strong>제목</strong>
                    <p>해리 포터와 마법사의 돌</p>
                </div>

                <div class="book-info">
                    <strong>저자</strong>
                    <p>J.K. Rowling</p>
                </div>

                <div class="book-info">
                    <strong>출판사</strong>
                    <p>문학수첩</p>
                </div>

                <div class="book-info">
                    <strong>장르</strong>
                    <p>판타지</p>
                </div>

                <div class="book-info">
                    <strong>대여상태</strong>
                    <p>
                        <span class="badge bg-success">
                            대여 가능
                        </span>
                    </p>
                </div>


                <div class="book-buttons">

                    <a href="edit.html" class="btn btn-primary">
                        edit
                    </a>

                    <button type="button" class="btn btn-danger" onclick="confirm('삭제할까요?');">
                        삭제
                    </button>

                </div>

            </div>

        </div>
    </main>




    <footer>
        <p class="text-center text-body-secondary">
            Book Management System © 2026
        </p>
    </footer>

</body>

</html>
