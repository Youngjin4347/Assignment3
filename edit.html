<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!--bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- My CSS -->
    <link rel="stylesheet" href="my.css">

</head>

<body>
    <header>
        <nav class="navbar navbar-dark fixed-top bg-dark">
            <div class="container-fluid justify-content-between">

                <div class="d-flex align-items-center">
                    <img src="https://previews.123rf.com/images/siamimages/siamimages1612/siamimages161200561/67760057-book-icon-illustration-design.jpg"
                        class="logo" alt="Book Management">

                    <p class="navbar-brand mb-0 ms-2">Book Management</p>
                </div>
                <a href="index.html" class="nav-link text-white me-3">
                    Go to Home
                </a>

            </div>
        </nav>

        <div class="container pt-5">
            <h1>도서 정보 수정</h1>
            <p>도서 정보를 수정할 수 있습니다.</p>
        </div>
    </header>

    <main class="container mt-5 pt-5">

        <div class="mb-4">
            <h1>도서 수정</h1>
            <p>기존 도서 정보를 수정할 수 있습니다.</p>
        </div>


        <form>

            <div class="mb-3">
                <label for="bookId" class="form-label">도서 ID</label>
                <input type="number" class="form-control" id="bookId" name="bookId" value="1" required>
            </div>


            <div class="mb-3">
                <label for="title" class="form-label">제목</label>
                <input type="text" class="form-control" id="title" name="title" value="해리 포터와 마법사의 돌" required>
            </div>


            <div class="mb-3">
                <label for="author" class="form-label">저자</label>
                <input type="text" class="form-control" id="author" name="author" value="J.K. Rowling" required>
            </div>


            <div class="mb-3">
                <label for="publisher" class="form-label">출판사</label>
                <input type="text" class="form-control" id="publisher" name="publisher" value="문학수첩" required>
            </div>


            <div class="mb-3">
                <label for="genre" class="form-label">장르</label>
                <input type="text" class="form-control" id="genre" name="genre" value="판타지" required>
            </div>


            <div class="mb-4">
                <label for="status" class="form-label">대여상태</label>

                <select class="form-select" id="status" name="status" required>

                    <option value="대여 가능" selected>
                        대여 가능
                    </option>

                    <option value="대여 중">
                        대여 중
                    </option>

                </select>
            </div>


            <div>
                <button type="button" class="btn btn-info" onclick="confirm('수정할까요?');">
                        수정
                    </button>

                <a href="view.html" class="btn btn-secondary">
                    취소
                </a>
            </div>

        </form>

    </main>



    <footer>
        <p class="text-center text-body-secondary">
            Book Management System © 2026
        </p>
    </footer>

</body>

</html>
